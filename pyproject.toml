[project]
name = "fourx"
version = "0.0.0"
requires-python = ">=3.15,<3.16"
dependencies = []

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-bdd>=9.0.0",
    "import-linter>=2.15",
    "pre-commit>=4.7.0",
]

[tool.uv]
exclude-newer = "2026-10-18"
required-version = ">=0.11.16"
