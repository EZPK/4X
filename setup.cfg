# Configuration de mutmut 3.8.1 (docs/designs/niveau-2-m1-noyau.md, plan détaillé, point 5).
# Chemin protégé. Les listes ont une valeur par ligne : mutmut découpe la valeur aux retours à la ligne.
[mutmut]
source_paths =
    src/fourx
pytest_add_cli_args_test_selection =
    tests
pytest_add_cli_args =
    -m
    not rejeu and not lent and not mesure
    --ignore=tests/outillage
    --ignore=tests/core/test_determinisme_statique.py
also_copy =
    pytest.ini
# do_not_mutate : chemins exacts, sans joker (mutmut lit les motifs avec fnmatch, mutation.py
# avec .github/scripts/motifs.py : un joker n'y aurait pas le même sens).
do_not_mutate =
    src/fourx/__main__.py
    src/fourx/clients/textual_app.py
