# CI de M0 (docs/designs/niveau-2-m0-garde-fous.md, plan détaillé, point 23).
# Les tâches obligatoires n'ont pas de clé de nom : le nom du contrôle est l'identifiant de la tâche.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  BASE: ${{ github.event.pull_request.base.sha }}
  HEAD: ${{ github.event.pull_request.head.sha }}
  BEFORE: ${{ github.event.before }}
  AFTER: ${{ github.event.after }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - run: uv python install
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - run: uv python install
      - run: uv sync --locked
      - run: uv run mypy

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - run: uv python install
      - run: uv sync --locked
      - name: Installer gitleaks 8.30.1
        run: |
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          rm gitleaks_8.30.1_linux_x64.tar.gz
      - name: Analyser les commits
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            INTERVALLE="$BASE...$HEAD"
          elif [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            INTERVALLE="$AFTER"
          else
            INTERVALLE="$BEFORE..$AFTER"
          fi
          ./gitleaks git --redact --config .gitleaks.toml --log-opts="$INTERVALLE" .

  termes-interdits:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - run: uv python install
      - run: uv sync --locked
      - name: Chercher les termes interdits
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --name-only "$BASE...$HEAD" > "$RUNNER_TEMP/fichiers.txt"
            git log --format=%B%x00 "$BASE...$HEAD" > "$RUNNER_TEMP/messages.txt"
            uv run python .github/scripts/termes_interdits.py --liste docs/termes-interdits.md \
              --evenement "$GITHUB_EVENT_PATH" --fichiers "$RUNNER_TEMP/fichiers.txt" \
              --messages "$RUNNER_TEMP/messages.txt"
          else
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              git log --format=%B%x00 "$AFTER" > "$RUNNER_TEMP/messages.txt"
            else
              git log --format=%B%x00 "$BEFORE..$AFTER" > "$RUNNER_TEMP/messages.txt"
            fi
            uv run python .github/scripts/termes_interdits.py --liste docs/termes-interdits.md \
              --messages "$RUNNER_TEMP/messages.txt"
          fi

  tests-outillage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - run: uv python install
      - run: uv sync --locked
      - run: uv run pytest

  imports:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - run: uv python install
      - run: uv sync --locked
      - run: uv run lint-imports
