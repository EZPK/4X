[pytest]
testpaths = tests
addopts = -p pytester --import-mode=importlib --strict-markers
bdd_features_base_dir = tests/scenarios
pythonpath = .
markers =
    rejeu: rejeu de la partie de référence sur 100 000 ticks (tâche rejeu)
    proprietes: tests de propriétés hypothesis (tâche proprietes)
    lent: fourchettes économiques sur 100 000 ticks (tâche rejeu)
    mesure: indicateur avancé, lancé à la main avec FOURX_MESURE=1
